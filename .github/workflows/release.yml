name: Release Clever VPN

# Tag driven releases only: a run either publishes a GitHub prerelease or a normal
# GitHub Release. Test builds are driven by a commit instead of a tag, so they live in
# internal.yml.
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "prerelease: publish a GitHub prerelease. release: publish a normal GitHub Release."
        required: true
        default: release
        type: choice
        options:
          - prerelease
          - release
      tag_name:
        description: "Optional. Existing tag: build tagged commit; missing tag: use main HEAD; empty (release only): auto-bump latest release patch."
        required: false
        type: string

# A release must not be cancelled halfway through publishing.
concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate_tag:
    name: Resolve Build Mode and Version
    runs-on: windows-latest
    outputs:
      installer_version: ${{ steps.parse.outputs.installer_version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
      build_ref: ${{ steps.parse.outputs.build_ref }}
      target_commit_sha: ${{ steps.parse.outputs.target_commit_sha }}
      tag_exists: ${{ steps.parse.outputs.tag_exists }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve mode, validate tag, and compute versions
        id: parse
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Normalize-Tag([string] $value) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return ""
            }

            $trimmed = $value.Trim()
            if ($trimmed.StartsWith("v")) {
              return $trimmed
            }

            return "v$trimmed"
          }

          $mode = "${{ inputs.release_mode }}"
          $tag = "${{ inputs.tag_name }}".Trim()

          if ($mode -notin @("prerelease", "release")) {
            Write-Error "Invalid release_mode '$mode'. Expected one of: prerelease, release."
            exit 1
          }

          $isPrerelease = "false"
          $buildRef = "${{ github.sha }}"
          $resolvedTagName = ""
          $targetCommitSha = ""
          $tagExists = "false"
          $semver = ""
          $installerVersion = ""

          $releaseRegex = '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'
          $prereleaseRegex = '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)-rc\.(?<rc>[1-9]\d*)$'

          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($mode -ne "release") {
              Write-Error "tag_name is required when release_mode is '$mode'."
              exit 1
            }

            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $latestReleaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/latest"

            try {
              $latestRelease = Invoke-RestMethod -Uri $latestReleaseUri -Headers $headers -Method Get
              $latestTag = Normalize-Tag $latestRelease.tag_name
              if ($latestTag -notmatch $releaseRegex) {
                Write-Error "Latest GitHub Release tag '$latestTag' is not a stable v<major>.<minor>.<patch> tag."
                exit 1
              }

              $nextPatch = [int]$Matches.patch + 1
              $tag = "v$($Matches.major).$($Matches.minor).$nextPatch"
            } catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              if ($statusCode -eq 404) {
                $tag = "v0.0.1"
              } else {
                throw
              }
            }

            Write-Host "No tag_name provided; auto-selected release tag '$tag'."
          }

          $tag = Normalize-Tag $tag

          if ($mode -eq "prerelease") {
            if ($tag -notmatch $prereleaseRegex) {
              Write-Error "Invalid prerelease tag '$tag'. Expected format: v<major>.<minor>.<patch>-rc.<n>"
              exit 1
            }
            $isPrerelease = "true"
          }

          if ($mode -eq "release") {
            if ($tag -notmatch $releaseRegex) {
              Write-Error "Invalid release tag '$tag'. Expected format: v<major>.<minor>.<patch>"
              exit 1
            }
            $isPrerelease = "false"
          }

          git rev-parse --verify --quiet "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = "true"
            $targetCommitSha = (git rev-list -n 1 "refs/tags/$tag").Trim()
          } else {
            $targetCommitSha = (git rev-parse "refs/remotes/origin/main").Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($targetCommitSha)) {
              Write-Error "Unable to resolve origin/main for missing tag '$tag'."
              exit 1
            }

            Write-Host "Tag '$tag' does not exist; building from main HEAD $targetCommitSha."
          }

          if ($tag -match '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)') {
            $semver = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          } else {
            Write-Error "Unable to parse semantic version from tag '$tag'."
            exit 1
          }

          $installerVersion = "$semver.0"
          $resolvedTagName = $tag
          $buildRef = $targetCommitSha

          "installer_version=$installerVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$resolvedTagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_ref=$buildRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target_commit_sha=$targetCommitSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_exists=$tagExists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Mode=$mode"
          Write-Host "BuildRef=$buildRef"
          Write-Host "TagName=$resolvedTagName"
          Write-Host "TagExists=$tagExists"
          Write-Host "TargetCommitSha=$targetCommitSha"
          Write-Host "InstallerVersion=$installerVersion"

  build_installers:
    name: Build Installers
    needs: validate_tag
    permissions:
      contents: read
    uses: ./.github/workflows/_build-installers.yml
    with:
      build_ref: ${{ needs.validate_tag.outputs.build_ref }}
      installer_version: ${{ needs.validate_tag.outputs.installer_version }}
      # These artifacts are consumed inside this run; the published copies live in the
      # GitHub Release, so a short retention is enough.
      retention_days: 1
      include_setup: true

  publish_github_release:
    name: Publish GitHub Release
    needs:
      - validate_tag
      - build_installers
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts

      - name: Create missing tag at publish time
        id: ensure_tag
        if: ${{ needs.validate_tag.outputs.tag_exists != 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            ref = "refs/tags/${{ needs.validate_tag.outputs.tag_name }}"
            sha = "${{ needs.validate_tag.outputs.target_commit_sha }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/git/refs" -Headers $headers -Method Post -Body $body -ContentType "application/json" | Out-Null
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create release from tag type
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate_tag.outputs.tag_name }}
          name: ${{ needs.validate_tag.outputs.tag_name }}
          prerelease: ${{ needs.validate_tag.outputs.prerelease }}
          files: |
            artifacts/**/*.msi
            artifacts/**/*.msixbundle
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up tag after failed publish
        if: ${{ failure() && steps.ensure_tag.outputs.created == 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseLookupUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.validate_tag.outputs.tag_name }}"
          try {
            $release = Invoke-RestMethod -Uri $releaseLookupUri -Headers $headers -Method Get
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($release.id)" -Headers $headers -Method Delete | Out-Null
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -ne 404) {
              throw
            }
          }

          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${{ needs.validate_tag.outputs.tag_name }}" -Headers $headers -Method Delete | Out-Null
